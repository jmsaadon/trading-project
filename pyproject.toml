[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-project"
version = "0.1.0"
description = "Daily ETF relative-value research data pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
    "yfinance>=0.2.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
etf-data = "trading_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trading_project.data" = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
